_version = 1

[workflow]
graph = "workflow.fabro"

[run.inputs]
repo = ""
ready_label = "fabro-ready"
running_label = "fabro-running"
failed_label = "fabro-failed"

[run.integrations.github]
permissions = { contents = "read", issues = "write", pull_requests = "read", checks = "read", statuses = "read", vulnerability_alerts = "read", security_events = "read" }

[run.run_branch]
enabled = false

[run.pull_request]
enabled = false

[[run.prepare.steps]]
script = '''
set -eu
mkdir -p .git
cat > .git/dispatch-stack-scan.py <<'DISPATCH_STACK_SCAN_PY'
import json, os, re, sys, urllib.error, urllib.parse, urllib.request

QUEUE_PATH = ".git/dispatch-queue.json"
API_BASE = os.environ.get("DISPATCH_API_BASE", "http://host.docker.internal:32276/api/v1").rstrip("/")
GITHUB_BASE = os.environ.get("DISPATCH_GITHUB_API_BASE", "https://api.github.com").rstrip("/")
STACK_BRANCH = re.compile(r"^stack/([a-z0-9][a-z0-9-]*)/([1-4])-(brief|requirements|design|tasks)$")
ISSUE_REF = re.compile(r"\bfor issue\s+#(\d+)\b", re.IGNORECASE)
ACTIVE_STATUSES = ("pending", "runnable", "initializing", "running", "blocked")


def request(base, method, path, token=None):
    headers = {"Accept": "application/vnd.github+json", "User-Agent": "fabro-dispatch-workflow"}
    if token:
        headers.update({"Authorization": "Bearer " + token, "X-GitHub-Api-Version": "2026-03-10"})
    req = urllib.request.Request(base + path, method=method, headers=headers)
    try:
        with urllib.request.urlopen(req, timeout=60) as response:
            raw = response.read()
            return json.loads(raw) if raw else None
    except urllib.error.HTTPError as exc:
        detail = exc.read().decode("utf-8", "replace")[:1000]
        sys.exit("dispatch stack scan: %s %s failed: HTTP %s\n%s" % (method, path, exc.code, detail))


def graphql(token, query, variables):
    body = json.dumps({"query": query, "variables": variables}).encode()
    req = urllib.request.Request(GITHUB_BASE + "/graphql", method="POST", data=body, headers={
        "Authorization": "Bearer " + token,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json",
        "X-GitHub-Api-Version": "2026-03-10",
        "User-Agent": "fabro-dispatch-workflow",
    })
    try:
        with urllib.request.urlopen(req, timeout=60) as response:
            result = json.loads(response.read())
    except urllib.error.HTTPError as exc:
        detail = exc.read().decode("utf-8", "replace")[:1000]
        sys.exit("dispatch stack scan: GraphQL failed: HTTP %s\n%s" % (exc.code, detail))
    if result.get("errors"):
        sys.exit("dispatch stack scan: GraphQL errors: %s" % json.dumps(result["errors"])[:1000])
    return result.get("data") or {}


def unresolved_threads(token, owner, repo, number):
    query = """
    query($owner:String!,$repo:String!,$number:Int!,$cursor:String){
      repository(owner:$owner,name:$repo){pullRequest(number:$number){
        reviewThreads(first:100,after:$cursor){
          nodes{isResolved comments(first:100){nodes{body}}}
          pageInfo{hasNextPage endCursor}
        }
      }}
    }
    """
    cursor = None
    while True:
        data = graphql(token, query, {"owner": owner, "repo": repo, "number": number, "cursor": cursor})
        pr = (((data.get("repository") or {}).get("pullRequest")) or {})
        page = pr.get("reviewThreads") or {}
        for thread in page.get("nodes") or []:
            if not thread.get("isResolved") and any(
                (comment.get("body") or "").strip()
                for comment in ((thread.get("comments") or {}).get("nodes") or [])
            ):
                return True
        info = page.get("pageInfo") or {}
        if not info.get("hasNextPage"):
            return False
        cursor = info.get("endCursor")


def stack_source_issue(pr, stacked_numbers):
    if pr.get("number") not in stacked_numbers:
        return None
    head = ((pr.get("head") or {}).get("ref") or "")
    if not STACK_BRANCH.fullmatch(head):
        return None
    match = ISSUE_REF.search(pr.get("body") or "")
    return int(match.group(1)) if match else None


def active_kiro_issues(repo):
    active = set()
    query = urllib.parse.urlencode([("status", status) for status in ACTIVE_STATUSES] + [("page[limit]", "100")])
    req = urllib.request.Request(API_BASE + "/runs?" + query, headers={"Accept": "application/json"})
    try:
        with urllib.request.urlopen(req, timeout=60) as response:
            body = json.loads(response.read())
    except urllib.error.HTTPError as exc:
        detail = exc.read().decode("utf-8", "replace")[:1000]
        sys.exit("dispatch stack scan: could not list active Fabro runs: HTTP %s\n%s" % (exc.code, detail))
    for run in (body or {}).get("data") or []:
        if ((run.get("workflow") or {}).get("slug") or "") != "kiro-spec":
            continue
        if (((run.get("repository") or {}).get("name") or "").lower()) != repo.lower():
            continue
        labels = run.get("labels") or {}
        value = labels.get("issue") if isinstance(labels, dict) else None
        match = re.search(r"\d+", str(value or ""))
        if match:
            active.add(int(match.group(0)))
    return active


def queue_has_items(queue):
    return bool(queue["issues"] or queue["pull_requests"] or queue["findings"])


def main():
    token = os.environ.get("GITHUB_TOKEN", "")
    if not token:
        sys.exit("GITHUB_TOKEN is not set; declare [run.integrations.github.permissions] on this workflow")
    queue = json.load(open(QUEUE_PATH))
    owner, repo = queue["repo"].split("/", 1)
    slug = queue["repo"]
    stacks = request(GITHUB_BASE, "GET", "/repos/%s/stacks?per_page=100" % slug, token) or []
    stacked_numbers = {
        pr.get("number")
        for stack in stacks
        for pr in (stack.get("pull_requests") or [])
        if pr.get("number") is not None
    }
    if not stacked_numbers:
        queue["kiro_spec_issues"] = []
        json.dump(queue, open(QUEUE_PATH, "w"), indent=1, sort_keys=True)
        print(json.dumps({"context_updates": {"has_queue": "true" if queue_has_items(queue) else "false"}}))
        return

    candidates = {}
    page = 1
    while page <= 10:
        query = urllib.parse.urlencode({"state": "open", "per_page": 100, "page": page})
        batch = request(GITHUB_BASE, "GET", "/repos/%s/pulls?%s" % (slug, query), token) or []
        for pr in batch:
            issue_number = stack_source_issue(pr, stacked_numbers)
            if issue_number is None:
                if pr.get("number") in stacked_numbers and STACK_BRANCH.fullmatch(
                    ((pr.get("head") or {}).get("ref") or "")
                ) and not ISSUE_REF.search(pr.get("body") or ""):
                    print("dispatch stack scan: skipping PR #%s; no source issue reference" % pr.get("number"), file=sys.stderr)
                continue
            if not issue_number:
                print("dispatch stack scan: skipping PR #%s; no source issue reference" % pr.get("number"), file=sys.stderr)
                continue
            candidates.setdefault(issue_number, []).append(pr)
        if len(batch) < 100:
            break
        page += 1

    active = active_kiro_issues(slug)
    existing = {issue.get("number") for issue in queue.get("issues") or []}
    dispatched = []
    for issue_number, prs in sorted(candidates.items()):
        if issue_number in active:
            continue
        feedback_prs = [
            pr for pr in prs
            if unresolved_threads(token, owner, repo, pr["number"])
        ]
        if not feedback_prs:
            continue
        issue = request(GITHUB_BASE, "GET", "/repos/%s/issues/%d" % (slug, issue_number), token)
        if not issue or issue.get("state") != "open" or issue.get("pull_request"):
            continue
        existing_issue = next((item for item in queue["issues"] if item.get("number") == issue_number), None)
        if existing_issue:
            labels = existing_issue.setdefault("labels", [])
            if "type/kiro-spec" not in labels:
                labels.append("type/kiro-spec")
        else:
            queue["issues"].append({
                "number": issue_number,
                "title": (issue.get("title") or "").strip(),
                "url": issue.get("html_url", ""),
                "labels": ["type/kiro-spec"],
                "source": "open_kiro_spec_stack",
                "stack_prs": sorted(pr["number"] for pr in feedback_prs),
            })
            existing.add(issue_number)
        dispatched.append({"issue": issue_number, "prs": sorted(pr["number"] for pr in feedback_prs)})
    queue["kiro_spec_issues"] = dispatched
    queue["issues"].sort(key=lambda issue: issue.get("number", 0))
    json.dump(queue, open(QUEUE_PATH, "w"), indent=1, sort_keys=True)
    has_queue = queue_has_items(queue)
    print("dispatch stack scan: open stacks with unresolved KiroSpec feedback=%d active_kiro_spec_runs=%d" % (
        len(dispatched), len(active)), file=sys.stderr)
    print(json.dumps({"context_updates": {
        "has_queue": "true" if has_queue else "false",
        "has_issues": "true" if queue["issues"] else "false",
        "has_pull_requests": "true" if queue["pull_requests"] else "false",
        "issue_count": str(len(queue["issues"])),
        "pull_request_count": str(len(queue["pull_requests"])),
    }}))


if __name__ == "__main__":
    main()
DISPATCH_STACK_SCAN_PY
python3 -c "import py_compile; py_compile.compile('.git/dispatch-stack-scan.py', doraise=True)"
'''

[[run.prepare.steps]]
script = '''
set -eu
mkdir -p .git
cat > .git/dispatch-security-scan.py <<'DISPATCH_SECURITY_SCAN_PY'
import re
import sys
import urllib.parse

SOURCES = ("dependabot", "code-scanning")  # secret scanning is never requested
SOURCE_ORDER = {"dependabot": 0, "code-scanning": 1}
PAGE_SIZE = 100
MAX_PAGES = 10
ALERT_PATHS = {
    "dependabot": "/repos/%s/dependabot/alerts",
    "code-scanning": "/repos/%s/code-scanning/alerts",
}


def alert_url(slug, source, number):
    return "https://github.com/%s/security/%s/%s" % (slug, source, number)


def alert_fields(slug, source, payload):
    number = int(payload["number"])
    url = payload.get("html_url") or alert_url(slug, source, number)
    if source == "dependabot":
        advisory = payload.get("security_advisory") or {}
        dependency = payload.get("dependency") or {}
        package = (dependency.get("package") or {}).get("name") or ""
        title = advisory.get("summary") or package or "Dependabot alert #%d" % number
        finding = {
            "source": source,
            "number": number,
            "title": str(title).strip(),
            "url": url,
        }
        if package:
            finding["package"] = package
        return finding
    rule = payload.get("rule") or {}
    instance = payload.get("most_recent_instance") or {}
    message = (instance.get("message") or {}).get("text") or ""
    title = rule.get("description") or rule.get("id") or message or "Code scanning alert #%d" % number
    return {
        "source": source,
        "number": number,
        "title": str(title).strip(),
        "url": url,
    }


def remediation_branch(source, number):
    return "security/%s-%s" % (source, int(number))


def branch_finding(ref):
    match = re.match(r"^security/([a-z-]+)-(\d+)$", ref or "")
    if not match:
        return None
    source = match.group(1)
    if source not in SOURCE_ORDER:
        return None
    return (source, int(match.group(2)))


def finding_id(source, number):
    return "%s:%s" % (source, int(number))


def package_mentioned(package, text):
    if not package or not text:
        return False
    pattern = r"(?<![A-Za-z0-9._@/-])%s(?![A-Za-z0-9._@/-])" % re.escape(package)
    return re.search(pattern, text) is not None


def next_page_path(headers):
    # Dependabot alerts use cursor pagination; the endpoint rejects `page`.
    link = (headers or {}).get("link") or (headers or {}).get("Link") or ""
    for part in link.split(","):
        if 'rel="next"' not in part:
            continue
        match = re.search(r"<([^>]+)>", part)
        if not match:
            continue
        parsed = urllib.parse.urlsplit(match.group(1))
        return parsed.path + ("?" + parsed.query if parsed.query else "")
    return None


def list_alerts(slug, source, request):
    if source not in ALERT_PATHS:
        sys.exit("dispatch scan: %s alerts could not be read: unsupported alert source" % source)
    findings = []
    path = None
    for page in range(1, MAX_PAGES + 1):
        if path is None:
            params = {"state": "open", "per_page": PAGE_SIZE}
            if source != "dependabot":
                params["page"] = page
            path = "%s?%s" % (ALERT_PATHS[source] % slug, urllib.parse.urlencode(params))
        try:
            batch, headers = request("GET", path, with_headers=True)
            findings.extend(alert_fields(slug, source, alert) for alert in batch)
        except SystemExit as exc:
            sys.exit("dispatch scan: %s alerts could not be read: %s" % (source, str(exc) or "no detail"))
        except Exception as exc:
            sys.exit("dispatch scan: %s alerts could not be read: %s" % (source, str(exc) or exc.__class__.__name__))
        if source == "dependabot":
            path = next_page_path(headers)
            if not path:
                return findings
        elif len(batch) < PAGE_SIZE:
            return findings
        else:
            path = None
    sys.exit("dispatch scan: %s alerts could not be read: more than %d open alerts over %d pages; refusing to truncate" % (
        source, PAGE_SIZE * MAX_PAGES, MAX_PAGES))


def open_pull_requests(slug, request):
    pulls = []
    for page in range(1, MAX_PAGES + 1):
        query = urllib.parse.urlencode({"state": "open", "per_page": PAGE_SIZE, "page": page})
        path = "/repos/%s/pulls?%s" % (slug, query)
        try:
            batch = request("GET", path) or []
        except SystemExit as exc:
            sys.exit("dispatch scan: open pull requests could not be read: %s" % (str(exc) or "no detail"))
        except Exception as exc:
            sys.exit("dispatch scan: open pull requests could not be read: %s" % (str(exc) or exc.__class__.__name__))
        for payload in batch:
            pulls.append({
                "number": int(payload["number"]),
                "head_ref": (payload.get("head") or {}).get("ref") or "",
                "author": (payload.get("user") or {}).get("login") or "",
                "title": payload.get("title") or "",
                "body": payload.get("body") or "",
            })
        if len(batch) < PAGE_SIZE:
            return pulls
    sys.exit("dispatch scan: open pull requests could not be read: more than %d open pull requests over %d pages; refusing to truncate" % (
        PAGE_SIZE * MAX_PAGES, MAX_PAGES))


def exclusions(findings, pulls):
    remediation_heads = set()
    for pull in pulls:
        parsed = branch_finding(pull.get("head_ref") or "")
        if parsed is not None:
            remediation_heads.add(parsed)
    dependabot_prs = [
        pull for pull in pulls
        if (pull.get("author") or "").lower() == "dependabot[bot]"
    ]
    eligible, excluded = [], []
    for finding in findings:
        reason = None
        if (finding["source"], int(finding["number"])) in remediation_heads:
            reason = "remediation_pr_open"
        elif finding["source"] == "dependabot" and finding.get("package"):
            for pull in dependabot_prs:
                text = "%s\n%s" % (pull.get("title") or "", pull.get("body") or "")
                if package_mentioned(finding["package"], text):
                    reason = "dependabot_pr_open"
                    break
        if reason:
            excluded.append({
                "source": finding["source"],
                "number": int(finding["number"]),
                "reason": reason,
            })
        else:
            eligible.append(finding)
    return eligible, excluded


def finding_sort_key(finding):
    return (SOURCE_ORDER.get(finding["source"], len(SOURCE_ORDER)), int(finding["number"]))


def select_finding(eligible):
    if not eligible:
        return None
    return sorted(eligible, key=finding_sort_key)[0]


def active_remediation_run(runs, slug):
    for run in runs or []:
        if ((run.get("workflow") or {}).get("slug") or "") != "security-remediation":
            continue
        if ((run.get("repository") or {}).get("name") or "").lower() != slug.lower():
            continue
        return run.get("id")
    return None


def scan(slug, request, runs):
    findings = []
    for source in SOURCES:
        findings.extend(list_alerts(slug, source, request))
    findings.sort(key=finding_sort_key)
    pulls = open_pull_requests(slug, request)
    eligible, excluded = exclusions(findings, pulls)
    return {
        "findings": findings,
        "remediation": {
            "active_run": active_remediation_run(runs, slug),
            "excluded": excluded,
            "eligible": [finding_id(finding["source"], finding["number"]) for finding in eligible],
            "selected": select_finding(eligible),
        },
    }
DISPATCH_SECURITY_SCAN_PY
python3 -c "import py_compile; py_compile.compile('.git/dispatch-security-scan.py', doraise=True)"
'''
