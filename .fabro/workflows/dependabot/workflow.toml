_version = 1

[workflow]
graph = "workflow.fabro"

[run.inputs]
pr = ""
ci_failures = ""
reason = ""

[run.model.fallbacks]
"gpt-6-luna" = ["litellm:deepseek-v4.1-flash"]

# Full history: rebasing the PR branch onto the base branch needs the real merge base
# across both histories.
[run.clone]
depth = 0

# contents: write - fetch and force-push the PR branch; issues: write - swap the
# fabro-running and fabro-failed dispatch labels; pull_requests, checks, actions: read -
# read the PR, its CI check runs, and failed job logs.
[run.integrations.github]
permissions = { contents = "write", pull_requests = "read", issues = "write", checks = "read", actions = "read" }

# Checkpoints MUST stay disabled: Fabro's checkpoint commits run `git add -A` + `git commit`
# on the current HEAD, which here is the PR branch, and would both violate the single-commit
# invariant and corrupt the amend target.
[run.run_branch]
enabled = false

[run.pull_request]
enabled = false

