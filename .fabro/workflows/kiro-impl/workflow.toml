_version = 1

[workflow]
graph = "workflow.fabro"

[run.inputs]
spec = ""
base = ""
trunk = ""

[run.agent]
fabro_tools = true

[run.integrations.github]
permissions = { contents = "write", pull_requests = "write" }

[run.run_branch]
enabled = true
push = true

[run.pull_request]
enabled = false

[run.checkpoint]
exclude_globs = [
    "**/node_modules/**",
    "**/target/**",
    "**/dist/**",
    "**/build/**",
    "**/.venv/**",
    "**/__pycache__/**",
    "**/.cache/**",
    "**/.pytest_cache/**",
]
