_version = 1

[workflow]
graph = "workflow.fabro"

[run.inputs]
spec = ""
base = ""
trunk = ""

# DeepSeek V4.1 Flash saturates its OpenCode Go cell under dispatch fan-out;
# fail over to the ChatGPT-backed Luna. DeepSeek's wire has no fabro effort
# enum, so the xhigh control only takes effect on the fallback, which is the
# level gpt-6-luna advertises.
[run.model.controls]
reasoning_effort = "xhigh"

[run.model.fallbacks]
"deepseek-v4.1-flash" = ["litellm:gpt-6-luna"]

[run.agent]
fabro_tools = true

[run.integrations.github]
permissions = { contents = "write", pull_requests = "write" }

[run.run_branch]
enabled = true
push = true

[run.pull_request]
enabled = false

[run.checkpoint]
exclude_globs = [
    "**/node_modules/**",
    "**/target/**",
    "**/dist/**",
    "**/build/**",
    "**/.venv/**",
    "**/__pycache__/**",
    "**/.cache/**",
    "**/.pytest_cache/**",
]
