_version = 1

[workflow]
graph = "workflow.fabro"

[run.inputs]
window_hours = "12"
min_occurrences = "3"
max_runs = "100"
# Keep this list in sync with additional_repositories below: the minted
# GITHUB_TOKEN is scoped to exactly those repositories.
repos = "DWSR/nix-config,DWSR/total-recall"
fabro_web_base = "https://fabro.tuxedo-musical.ts.net"
dry_run = "false"

# DeepSeek V4.1 Flash saturates its OpenCode Go cell under dispatch fan-out;
# fail over to the ChatGPT-backed Luna, whose deployment pins xhigh effort.
[run.model.fallbacks]
"deepseek-v4.1-flash" = ["litellm:gpt-6-luna"]

# The analysis stage uses Fabro's host run tools to search failed runs and read
# their failure events; no Fabro credential enters the sandbox.
[run.agent]
fabro_tools = true

# The run's primary repository is DWSR/nix-config. The token must also reach
# the other repositories whose failures this workflow reports on, so issues can
# be filed in the repository that owns the failing runs.
[run.integrations.github]
additional_repositories = ["DWSR/total-recall"]
permissions = { contents = "read", issues = "write" }

# Read-only triage: never create a run branch or pull request.
[run.run_branch]
enabled = false

[run.pull_request]
enabled = false

