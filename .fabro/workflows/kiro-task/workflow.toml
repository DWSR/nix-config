_version = 1

[workflow]
graph = "workflow.fabro"

[run.inputs]
spec = ""
task = ""

# GPT-6 Luna is the default model with its deployment pinning xhigh effort;
# fail over to the OpenCode Go DeepSeek cell when ChatGPT quota is exhausted.
[run.model.fallbacks]
"gpt-6-luna" = ["litellm:deepseek-v4.1-flash"]

[run.run_branch]
enabled = true
push = true

[run.pull_request]
enabled = false

[run.checkpoint]
exclude_globs = [
    "**/node_modules/**",
    "**/target/**",
    "**/dist/**",
    "**/build/**",
    "**/.venv/**",
    "**/__pycache__/**",
    "**/.cache/**",
    "**/.pytest_cache/**",
]
