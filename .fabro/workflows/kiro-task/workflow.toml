_version = 1

[workflow]
graph = "workflow.fabro"

[run.inputs]
spec = ""
task = ""

# DeepSeek V4.1 Flash saturates its OpenCode Go cell under dispatch fan-out;
# fail over to the ChatGPT-backed Luna, whose deployment pins xhigh effort.
[run.model.fallbacks]
"deepseek-v4.1-flash" = ["litellm:gpt-6-luna"]

[run.run_branch]
enabled = true
push = true

[run.pull_request]
enabled = false

[run.checkpoint]
exclude_globs = [
    "**/node_modules/**",
    "**/target/**",
    "**/dist/**",
    "**/build/**",
    "**/.venv/**",
    "**/__pycache__/**",
    "**/.cache/**",
    "**/.pytest_cache/**",
]
