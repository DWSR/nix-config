version: 2
updates:
  # These lockfiles feed the Nix builds through importNpmLock, which reads
  # package-lock.json directly, so version updates here need no hash change.
  # Packages whose builds pin npmDepsHash are intentionally excluded: their
  # lockfile bumps would invalidate that hash and Fabro only repairs hashes for
  # PRs it is dispatched for, not for passing PRs that auto-merge.
  - package-ecosystem: npm
    directories:
      - /overlays/agentmemory-deps
      - /overlays/gcloud-mcp
      - /overlays/git-mcp-server
      - /overlays/observability-mcp
      - /overlays/obsidian-importer-deps
      - /overlays/opencode-cost-diagnosis-deps
      - /overlays/storage-mcp
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /configurations/fabro-vm/api-bridge
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Keep the actions pinned by .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
