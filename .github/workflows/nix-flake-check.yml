name: nix flake check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: nix flake check
    runs-on: macos-latest
    # `actions: write` is required by the cache action's purge feature.
    permissions:
      contents: read
      actions: write
    # The filtered build below still takes most of an hour cold; keep
    # headroom so a slow runner does not cancel a green run.
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      # Restore and save the Nix store through the GitHub Actions cache.
      # Only main pushes save and purge; pull requests restore the latest
      # main cache by key prefix.
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ github.sha }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          save: ${{ github.event_name == 'push' }}
          purge: ${{ github.event_name == 'push' }}
          purge-prefixes: nix-${{ runner.os }}-
          purge-last-accessed: P7D
          purge-primary-key: never

      - name: Validate Lima config
        run: nix build --no-link '.#checks.aarch64-darwin.lima-vm-config-validate'

      - name: Run builds as the runner user
        run: |
          # Several checks evaluate the flake again from inside their build
          # (for example tests/ast-grep-mcp). The daemon drops store-copy
          # requests from the untrusted nixbld users, so run builds as root
          # on this disposable runner. The installer appends its own
          # build-users-group line, hence the override after installation.
          echo 'build-users-group =' | sudo tee -a /etc/nix/nix.conf
          sudo launchctl kickstart -k system/org.nixos.nix-daemon

      - name: Run flake checks
        run: |
          # Building opencode cold takes over two hours; limactl refuses
          # root and fabro's validate check races build-dir cleanup. Gate
          # the remaining checks' builds while still evaluating every check.
          # shellcheck disable=SC2016
          attrs=$(nix eval --raw .#checks.aarch64-darwin --apply 'attrs:
            let
              names = builtins.filter
                (name: !(builtins.match "^(opencode|agentmemory-opencode|lima-vm-config-validate|fabro-workflows-validate).*" name != null))
                (builtins.attrNames attrs);
            in
            builtins.concatStringsSep " " (map (name: ".#checks.aarch64-darwin.${name}") names)')
          # shellcheck disable=SC2086
          nix build --no-link --keep-going $attrs
          # `nix flake check --no-build` cannot realise import-from-derivation
          # paths. Force every check's derivation, including the filtered
          # ones, so their IFD inputs (generated config files and package
          # files read during evaluation) exist without building the checks.
          # shellcheck disable=SC2016
          nix eval --raw .#checks.aarch64-darwin --apply 'attrs:
            builtins.concatStringsSep " " (builtins.map
              (name: (builtins.getAttr name attrs).drvPath)
              (builtins.attrNames attrs))' > /dev/null
          nix flake check --no-build --show-trace --keep-going
