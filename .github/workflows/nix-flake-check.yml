name: nix flake check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: nix flake check
    runs-on: macos-latest
    # Building every check from scratch takes longer than an hour on a cold
    # macOS runner (opencode and nono dominate); the previous 60-minute cap
    # cancelled otherwise-green runs.
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.3
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Run builds as the runner user
        run: |
          # Several checks evaluate the flake again from inside their build
          # (for example tests/ast-grep-mcp). The daemon drops store-copy
          # requests from the untrusted nixbld users, so run builds as root
          # on this disposable runner. The installer appends its own
          # build-users-group line, hence the override after installation.
          echo 'build-users-group =' | sudo tee -a /etc/nix/nix.conf
          sudo launchctl kickstart -k system/org.nixos.nix-daemon

      - name: Run flake checks
        run: |
          # Building the opencode package cold takes over two hours, so gate
          # the remaining checks' builds while still evaluating every check.
          # shellcheck disable=SC2016
          attrs=$(nix eval --raw .#checks.aarch64-darwin --apply 'attrs:
            let
              names = builtins.filter
                (name: !(builtins.match "^(opencode|agentmemory-opencode).*" name != null))
                (builtins.attrNames attrs);
            in
            builtins.concatStringsSep " " (map (name: ".#checks.aarch64-darwin.${name}") names)')
          # shellcheck disable=SC2086
          nix build --no-link --keep-going $attrs
          # The filtered build also materialises the IFD paths that --no-build
          # needs (base16-schemes); evaluating after it avoids dry-run paths.
          nix flake check --no-build --show-trace --keep-going
