name: nix flake check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: nix flake check
    runs-on: macos-latest
    # Building every check from scratch takes longer than an hour on a cold
    # macOS runner (opencode and nono dominate); the previous 60-minute cap
    # cancelled otherwise-green runs.
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.3
        with:
          # Several checks evaluate the flake again from inside their build
          # (for example tests/ast-grep-mcp). Builds run as the untrusted
          # nixbld users, and the daemon drops their store-copy requests, so
          # trust the build group for this disposable runner.
          extra_nix_config: |
            extra-trusted-users = @nixbld
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Run flake checks
        run: nix flake check --show-trace --keep-going
