name: prek

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: prek run --all-files
    # The flake exposes an aarch64-linux devShell as well as the darwin ones,
    # but this workflow still runs on the macOS runner.
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.3

      - name: Run prek hooks
        # Run in the devShell rather than building the sandboxed
        # `checks.<system>.pre-commit-check`: the Nix sandbox has no network
        # access, and the flake-checker hook (flake age) needs it.
        run: nix develop --command prek run --all-files

      - name: Show hook changes
        if: failure()
        run: git --no-pager diff
