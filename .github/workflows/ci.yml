name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_target:
  push:
    branches: [main]
  schedule:
    # Nix sources are not supported by CodeQL, but the Go, Rust, JavaScript,
    # Python, and workflow sources are. Scan the default branch weekly so
    # findings in unchanged code still surface.
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit-count: ${{ steps.plan.outputs.commit-count }}
      size: ${{ steps.plan.outputs.size }}
      codeql: ${{ steps.plan.outputs.codeql }}
      auto-merge: ${{ steps.plan.outputs.auto-merge }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Plan jobs
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          pr_default=false
          commit_count=false
          size=false
          kiro_only=false
          codeql=false
          auto_merge=false

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            case "$ACTION" in
              opened|synchronize|reopened)
                pr_default=true
                ;;
            esac
            case "$ACTION" in
              opened|synchronize|reopened|labeled|unlabeled)
                commit_count=true
                ;;
            esac
            if [[ "$commit_count" == "true" && ",${LABELS}," != *",Override: PR Size Check,"* ]]; then
              size=true
            fi
          fi

          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "pull_request_target" || "$EVENT_NAME" == "push" ]]; then
            if [[ -n "${BASE_SHA:-}" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
              changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
              if [[ -n "$changed" ]] && ! printf '%s\n' "$changed" | grep -qv '^\.kiro/'; then
                kiro_only=true
              fi
            fi
          fi

          if [[ "$pr_default" == "true" || "$EVENT_NAME" == "push" ]]; then
            if [[ "$kiro_only" != "true" ]]; then
              codeql=true
            fi
          fi
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            codeql=true
          fi
          if [[ "$EVENT_NAME" == "pull_request_target" && "$kiro_only" != "true" && "$PR_AUTHOR" == "dependabot[bot]" ]]; then
            auto_merge=true
          fi

          {
            echo "commit-count=$commit_count"
            echo "size=$size"
            echo "codeql=$codeql"
            echo "auto-merge=$auto_merge"
          } >> "$GITHUB_OUTPUT"

  commit-count:
    name: Fail if PR contains more than one commit
    needs: dispatch
    if: needs.dispatch.outputs.commit-count == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Fail if the PR contains more than one commit
        run: |
          set -euo pipefail
          commits=$(git rev-list --count ${{ github.event.pull_request.head.sha }} ^${{ github.event.pull_request.base.sha }})
          echo "PR contains ${commits} commit(s) (github.event.pull_request.commits=${{ github.event.pull_request.commits }})."
          if [ "${commits}" -gt 1 ] || [ "${{ github.event.pull_request.commits }}" -gt 1 ]; then
            echo "::error::A pull request must contain at most one commit (found ${commits})."
            exit 1
          fi

  size:
    name: Fail if PR changes more than 1000 lines
    needs: dispatch
    if: needs.dispatch.outputs.size == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Fail if the PR changes more than 1000 lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MAX_LINES: "1000"
        run: |
          set -euo pipefail
          changed=$(git diff --numstat "${BASE_SHA}...${HEAD_SHA}" |
            awk '{ added += $1; deleted += $2 } END { print added + deleted }')
          echo "PR changes ${changed} line(s) (limit: ${MAX_LINES})."
          if [ "${changed}" -gt "${MAX_LINES}" ]; then
            echo "::error::A pull request must change at most ${MAX_LINES} lines (found ${changed}). Add the 'Override: PR Size Check' label to override."
            exit 1
          fi

  analyze:
    needs: dispatch
    if: needs.dispatch.outputs.codeql == 'true'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Nix is the bulk of this repository, and CodeQL cannot analyze it.
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.39.3
        with:
          category: /language:${{ matrix.language }}

  auto-merge:
    name: Enable auto-merge
    needs: dispatch
    if: needs.dispatch.outputs.auto-merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-verification: true

      - name: Enable auto-merge for non-major updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --rebase "$PR_URL"
